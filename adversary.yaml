name: container/kustomize
version: 0.0.14
description: Reviews Kustomize overlays for mutable resources, image tags, and literal secrets.

triggers:
  manual: true
  files_changed:
    - "Kustomization"
    - "kustomization.yml"
    - "kustomization.yaml"
    - "**/Kustomization"
    - "**/kustomization.yml"
    - "**/kustomization.yaml"
    - "**/*.yaml"
    - "**/*.yml"

detection:
  files:
    - "Kustomization"
    - "kustomization.yml"
    - "kustomization.yaml"
    - "**/Kustomization"
    - "**/kustomization.yml"
    - "**/kustomization.yaml"
    - "**/*.yaml"
    - "**/*.yml"

runtime:
  name: node
  version: "22"
  command:
    - dist/index.js

permissions:
  enforcement: advisory
  filesystem:
    read:
      - .
    write:
      - .adversary/results
  network: false
  environment:
    allow: []

findings:
  format: adversary.review.v1
